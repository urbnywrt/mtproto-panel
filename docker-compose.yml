
name: mtproto-panel

services:
  db:
    image: postgres:16-alpine
    container_name: mtproto-panel-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME:-mtproto_panel}
      POSTGRES_USER: ${DB_USER:-mtproto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mtproto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mtproto} -d ${DB_NAME:-mtproto_panel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      provenance: false
    # См. IMAGE_REPO / IMAGE_TAG в .env — позволяют тянуть образы из своего форка.
    image: ${IMAGE_REPO:-ghcr.io/danielvnru}/mtproto-panel-backend:${IMAGE_TAG:-latest}
    container_name: mtproto-panel-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/project
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-mtproto_panel}
      DB_USER: ${DB_USER:-mtproto}
      DB_PASSWORD: ${DB_PASSWORD:-mtproto}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  frontend:
    build:
      context: ./frontend
      provenance: false
    image: ${IMAGE_REPO:-ghcr.io/danielvnru}/mtproto-panel-frontend:${IMAGE_TAG:-latest}
    container_name: mtproto-panel-frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Оба порта вынесены в переменные, чтобы этот файл не приходилось править
      # руками на машинах, где 80 или 443 уже заняты. Правка docker-compose.yml
      # на сервере конфликтует при каждом обновлении — используйте .env.
      - "${HTTP_PORT:-80}:80"
      - "${PORT:-443}:443"
    depends_on:
      - backend

volumes:
  pgdata:
