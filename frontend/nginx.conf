# Docker's embedded DNS. Without a resolver nginx looks up `backend` once, at startup,
# and keeps that address forever: every update recreates the backend container with a new
# IP, nginx keeps talking to the old one, and the whole /api/ answers 502 while the SPA
# itself loads fine. The resolver only comes into play if the host name is a variable —
# a literal in proxy_pass is still resolved at config load.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_host backend;
        # No URI part here on purpose: with a variable in proxy_pass nginx forwards the
        # request URI unchanged, and the backend's own routes already start with /api/.
        proxy_pass http://$backend_host:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
